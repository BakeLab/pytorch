# Owner(s): ["module: ci"]
name: Update PyTorch Labels in S3

on:
  label:
  workflow_dispatch:

concurrency:
  group: 1
  cancel-in-progress: true

jobs:
  update-labels-in-S3:
    runs-on: ubuntu-22.04
    if: ${{ github.repository == 'pytorch/pytorch' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout PyTorch
        uses: pytorch/pytorch/.github/actions/checkout-pytorch@main
        with:
          fetch-depth: 1
          submodules: false
