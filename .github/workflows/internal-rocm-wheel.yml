# Owner(s): ["module: rocm", "oncall: releng"]
name: internal-rocm-wheel

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  get-label-type:
    if: github.repository == vars.BINARY_RELEASE_REPOSITORY
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.actor }}
      curr_branch: ${{ github.ref_name }}
      curr_ref_type: ${{ github.ref_type }}
      check_experiments: lf

  build:
    name: manywheel-py3_14-rocm10_0-gfx1201-build
    if: github.repository == vars.BINARY_RELEASE_REPOSITORY
    needs: get-label-type
    uses: ./.github/workflows/_binary-build-linux.yml
    with:
      PYTORCH_ROOT: /pytorch
      PACKAGE_TYPE: manywheel
      DESIRED_CUDA: rocm10.0
      GPU_ARCH_VERSION: "10.0"
      GPU_ARCH_TYPE: rocm
      DOCKER_IMAGE: manylinux2_28-builder
      DOCKER_IMAGE_TAG_PREFIX: rocm10.0
      DESIRED_PYTHON: "3.14"
      runner_prefix: "${{ needs.get-label-type.outputs.label-type }}"
      runs_on: rel-l-x86iavx512-44-340
      use_container_directive: true
      ALPINE_IMAGE: 308535385114.dkr.ecr.us-east-1.amazonaws.com/tool/alpine
      PYTORCH_EXTRA_INSTALL_REQUIREMENTS: rocm[libraries,device-all]==10.0.*
      timeout-minutes: 420
      build_name: manywheel-py3_14-rocm10_0-gfx1201
      build_environment: internal-rocm-wheel
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
